services:
  postgres:
    image: postgres:18-alpine
    container_name: spendly-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - spendly-pgdata:/var/lib/postgresql/data

volumes:
  spendly-pgdata:
